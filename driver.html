<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDRF Field Unit — Live Telemetry Broadcaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-base font-bold tracking-wide">NDRF FIELD UNIT #4</h1>
                <p class="text-xs text-slate-400 font-mono">Hardware GPS Telemetry Broadcaster</p>
            </div>
            <div id="status-indicator" class="w-3 h-3 rounded-full bg-red-500"></div>
        </div>

        <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Latitude</span>
                <p id="lat-val" class="text-sm font-mono font-bold text-blue-400">Waiting...</p>
            </div>
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Longitude</span>
                <p id="lng-val" class="text-sm font-mono font-bold text-blue-400">Waiting...</p>
            </div>
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Speed</span>
                <p id="speed-val" class="text-sm font-mono font-bold text-emerald-400">0 km/h</p>
            </div>
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Packets Sent</span>
                <p id="packet-val" class="text-sm font-mono font-bold text-cyan-400">0</p>
            </div>
        </div>

        <button id="start-btn" onclick="startGPSTracking()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm transition flex items-center justify-center space-x-2 shadow-lg">
            <i class="fa-solid fa-satellite"></i>
            <span>START LIVE GPS BROADCAST</span>
        </button>
    </div>

    <script>
        const BACKEND_DOMAIN = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? window.location.host
            : 'surakshagrid-app.onrender.com';
        const API_BASE = (window.location.protocol === 'https:' ? 'https://' : 'http://') + BACKEND_DOMAIN;
        const WS_BASE = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + BACKEND_DOMAIN;

        let ws = null;
        let watchId = null;
        let packetCount = 0;

        function connectSocket() {
            ws = new WebSocket(`${WS_BASE}/ws/vehicle-telemetry`);
            
            ws.onopen = () => {
                document.getElementById('status-indicator').className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
            };
            ws.onclose = () => {
                document.getElementById('status-indicator').className = 'w-3 h-3 rounded-full bg-red-500';
                setTimeout(connectSocket, 2000);
            };
        }
        connectSocket();

        function startGPSTracking() {
            if (!("geolocation" in navigator)) {
                alert("Geolocation hardware not supported on this device.");
                return;
            }

            const btn = document.getElementById('start-btn');
            btn.className = "w-full py-3 bg-emerald-600 text-white font-bold rounded-lg text-sm cursor-default";
            btn.innerHTML = `<i class="fa-solid fa-tower-broadcast animate-pulse mr-2"></i> BROADCASTING HARDWARE GPS LIVE`;

            // High-accuracy continuous native GPS tracking (Just like Blinkit / Rapido Driver Apps)
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const speed = (position.coords.speed || 0) * 3.6; // Convert m/s to km/h
                    const heading = position.coords.heading || 0;

                    document.getElementById('lat-val').innerText = lat.toFixed(5);
                    document.getElementById('lng-val').innerText = lng.toFixed(5);
                    document.getElementById('speed-val').innerText = `${Math.round(speed)} km/h`;

                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const payload = {
                            type: "DRIVER_LOCATION_UPDATE",
                            unit_id: "NDRF-RESCUE-UNIT-4",
                            latitude: lat,
                            longitude: lng,
                            speed_kmh: speed,
                            heading: heading,
                            timestamp: Date.now()
                        };
                        ws.send(JSON.stringify(payload));
                        packetCount++;
                        document.getElementById('packet-val').innerText = packetCount;
                    }
                },
                (error) => {
                    console.error("GPS Error:", error);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 5000
                }
            );
        }
    </script>
</body>
</html>
