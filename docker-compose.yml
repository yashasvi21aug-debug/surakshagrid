version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: surakshagrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surakshagrid}
      POSTGRES_USER: ${POSTGRES_USER:-surakshagrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surakshagrid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-surakshagrid} -d ${POSTGRES_DB:-surakshagrid}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surakshagrid-net

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: surakshagrid-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@surakshagrid.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - surakshagrid-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surakshagrid-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-surakshagrid}@postgres:5432/${POSTGRES_DB:-surakshagrid}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - surakshagrid-net

volumes:
  postgres_data:

networks:
  surakshagrid-net:
    driver: bridge
