services:
  db:
    image: postgis/postgis:15-3.3
    container_name: surakshagrid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surakshagrid}
      POSTGRES_USER: ${POSTGRES_USER:-surakshagrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surakshagrid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surakshagrid} -d ${POSTGRES_DB:-surakshagrid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surakshagrid-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surakshagrid-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-SurakshaGrid}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-surakshagrid}
      POSTGRES_USER: ${POSTGRES_USER:-surakshagrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surakshagrid}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-surakshagrid}:${POSTGRES_PASSWORD:-surakshagrid}@db:5432/${POSTGRES_DB:-surakshagrid}
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - surakshagrid-net

  osrm:
    image: osrm/osrm-backend:latest
    container_name: surakshagrid-osrm
    restart: unless-stopped
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/${OSRM_DATASET:-delhi}.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - surakshagrid-net

volumes:
  postgres_data:

networks:
  surakshagrid-net:
    driver: bridge
