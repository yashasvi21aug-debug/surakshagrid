<div id="success-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="success-title">
  <div class="modal-card">
    <div class="modal-icon" aria-hidden="true">
      <i class="fa-solid fa-check text-xl"></i>
    </div>
    <h2 id="success-title" class="text-2xl font-bold font-narrow uppercase mt-4 mb-2">SOS Transmitted</h2>
    <p class="modal-copy text-sm text-slate-400">NDRF unit dispatched. Keep your phone line available.</p>
    <div class="ticket-box">
      <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-1">Assigned Ticket</p>
      <p id="ticket-value" class="ticket-value">TICK-0000</p>
    </div>
    <button id="return-button" class="w-full border border-slate-700 hover:border-emerald-500 bg-transparent py-3 text-slate-100 hover:text-emerald-400 font-bold text-xs tracking-wider uppercase transition-colors" type="button">
      Return to Portal
    </button>
  </div>
</div>
