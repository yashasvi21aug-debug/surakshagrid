<header class="h-[48px] bg-[#0d1117] border-b border-[#30363d] px-3 flex items-center justify-between z-30 flex-shrink-0 select-none">
  <!-- Brand & Sector Select -->
  <div class="flex items-center space-x-3">
    <a href="/" class="flex items-center space-x-2">
      <div class="w-6 h-6 bg-[#238636] rounded flex items-center justify-center text-white text-xs font-bold shadow-sm">
        <i class="fa-solid fa-shield-halved text-[11px]"></i>
      </div>
      <div class="flex items-baseline space-x-2">
        <span class="text-xs font-bold tracking-wider text-[#f0f6fc]">SURAKSHAGRID</span>
        <span class="text-[10px] bg-[#21262d] text-[#8b949e] px-1.5 py-0.5 rounded border border-[#30363d] font-mono">NDRF INCIDENT COMMAND</span>
      </div>
    </a>

    <!-- Active Sector Selector -->
    <div class="hidden lg:flex items-center text-xs font-mono text-[#58a6ff] bg-[#161b22] border border-[#30363d] px-2 py-1 rounded cursor-pointer hover:border-[#8b949e] transition-colors">
      <i class="fa-solid fa-layer-group text-[10px] mr-1.5 text-[#8b949e]"></i>
      <span>SECTOR: NCR - HINDON BASIN</span>
      <i class="fa-solid fa-chevron-down text-[9px] ml-1.5 text-[#8b949e]"></i>
    </div>
  </div>

  <!-- Live Clock & Status Badge -->
  <div class="hidden md:flex items-center space-x-4">
    <div id="clock-display" class="font-mono text-[11px] text-[#8b949e]">
      <span id="utc-clock">00:00:00 UTC</span>
      <span class="mx-1 text-[#30363d]">|</span>
      <span id="ist-clock" class="text-[#f0f6fc]">00:00:00 IST</span>
    </div>

    <div id="stream-badge" class="flex items-center gap-1.5 px-2 py-0.5 bg-[#161b22] border border-[#30363d] text-[#3fb950] rounded text-[11px] font-mono">
      <span class="status-dot-live"></span>
      <span id="stream-status-text">LIVE STREAM</span>
    </div>
  </div>

  <!-- Role Switcher -->
  <nav class="flex items-center space-x-1 font-mono text-[11px]">
    <a href="/" class="px-2 py-1 text-[#8b949e] hover:text-[#f0f6fc] rounded hover:bg-[#21262d] transition-colors">COMMAND</a>
    <a href="/dashboard" class="px-2 py-1 text-[#f0f6fc] bg-[#21262d] border border-[#30363d] rounded font-semibold">DIGITAL TWIN</a>
    <a href="/citizen" class="px-2 py-1 text-[#f85149] hover:bg-[#f85149]/10 rounded border border-[#f85149]/30 transition-colors font-bold">CITIZEN SOS</a>
    <a href="/driver" class="px-2 py-1 text-[#8b949e] hover:text-[#f0f6fc] rounded hover:bg-[#21262d] transition-colors">FIELD UNIT</a>
  </nav>
</header>
