<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#081014" />
  <title>{% block title %}SurakshaGrid — Flood Resiliency & Disaster Response Network{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Leaflet GIS CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/static/css/main.css" />
  {% block styles %}{% endblock %}
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">
  
  {% block nav %}
    {% include "components/nav.html" %}
  {% endblock %}

  <main class="flex-1 flex flex-col">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
    {% include "components/footer.html" %}
  {% endblock %}

  <!-- Core Modular JavaScript Services -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/ui.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
